<script>
function runServer(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (err) { reject(new Error(err && err.message ? err.message : String(err))); })
      [fnName].apply(null, args);
  });
}

const STATUS_META = {
  good: { icon: '✓', label: 'Good' },
  warning: { icon: '!', label: 'Warning' },
  critical: { icon: '✕', label: 'Critical' },
  pending: { icon: '…', label: 'Pending data' },
  error: { icon: '⚠', label: 'Error' },
};

const METER_TAB_ID = 'meter-register';

const state = {
  sheets: [],
  activeSheetId: null,
  search: '',
  division: '',
  status: '',
  sortKey: null,
  sortDir: 1,
  meters: [],
  expandedMeterId: null,
};

// --- theme ---

function applyStoredTheme() {
  const stored = localStorage.getItem('theme');
  if (stored === 'dark' || stored === 'light') {
    document.documentElement.setAttribute('data-theme', stored);
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = current ? current === 'dark' : prefersDark;
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}

// --- session / login ---

async function refreshSessionBadge() {
  const status = await runServer('getSessionStatus');
  const badge = document.getElementById('sessionBadge');
  if (status.loggedIn && !status.refreshExpired) {
    badge.textContent = 'Logged in as ' + status.username + ' (session until ' + new Date(status.expiresAt).toLocaleTimeString() + ')';
    badge.className = 'badge badge-good';
  } else {
    badge.textContent = 'Not logged in';
    badge.className = 'badge badge-critical';
  }
  return status;
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const otp = document.getElementById('loginOtp').value.trim();
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errorEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Logging in…';
  try {
    await runServer('loginToMdm', username, password, otp);
    document.getElementById('loginOtp').value = '';
    await boot();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Log in';
  }
}

// --- report view ---

function activeSheet() {
  return state.sheets.find(function (s) { return s.id === state.activeSheetId; });
}

function formatNumber(n, digits) {
  digits = digits === undefined ? 1 : digits;
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('en-IN', { maximumFractionDigits: digits, minimumFractionDigits: 0 });
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const allTabs = state.sheets.concat([{ id: METER_TAB_ID, label: 'METER REGISTER DATA' }]);
  allTabs.forEach(function (sheet) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (sheet.id === state.activeSheetId ? ' active' : '');
    btn.textContent = sheet.label;
    btn.addEventListener('click', function () {
      state.activeSheetId = sheet.id;
      state.search = '';
      state.division = '';
      state.status = '';
      state.sortKey = null;
      document.getElementById('searchBox').value = '';
      render();
    });
    tabs.appendChild(btn);
  });
}

function renderStats() {
  const sheet = activeSheet();
  const row = document.getElementById('statRow');
  if (!sheet) { row.innerHTML = ''; return; }
  const summary = sheet.summary;

  const tiles = [
    { label: 'Feeders', value: summary.feederCount, cls: '' },
    { label: 'Total input energy (MWH)', value: formatNumber(summary.totalInputMWH), cls: '' },
    { label: 'Total sold energy (MWH)', value: formatNumber(summary.totalSoldMWH), cls: '' },
    {
      label: 'Avg line loss (numeric rows)',
      value: summary.avgLossPercent === null ? '—' : formatNumber(summary.avgLossPercent) + '%',
      cls: summary.avgLossPercent === null ? '' : summary.avgLossPercent <= 15 ? 'status-good' : summary.avgLossPercent <= 25 ? 'status-warning' : 'status-critical',
    },
    {
      label: 'Flagged (warning + critical)',
      value: summary.flaggedCount,
      cls: summary.flaggedCount > 0 ? 'status-critical' : 'status-good',
    },
  ];

  row.innerHTML = tiles.map(function (t) {
    return '<div class="stat-tile"><div class="stat-label">' + t.label + '</div><div class="stat-value ' + t.cls + '">' + t.value + '</div></div>';
  }).join('');
}

function feederNameFor(cells) {
  return cells['FEEDER NAME'] || cells['Industrial Feeder Name'] || cells['FEEDER CODE'] || '—';
}

function renderMeterList() {
  const sheet = activeSheet();
  const container = document.getElementById('meterList');
  if (!sheet) { container.innerHTML = ''; return; }

  const ranked = sheet.rows
    .filter(function (r) { return r.status !== 'pending' && r.status !== 'error' && r.lossValue !== null; })
    .slice()
    .sort(function (a, b) { return Math.abs(b.lossValue) - Math.abs(a.lossValue); })
    .slice(0, 5);

  if (!ranked.length) {
    container.innerHTML = '<p class="stat-label">No numeric line-loss readings in this sheet.</p>';
    return;
  }

  const maxAbs = Math.max.apply(null, ranked.map(function (r) { return Math.abs(r.lossValue); }).concat([1]));

  container.innerHTML = ranked.map(function (r) {
    const pct = Math.min(100, (Math.abs(r.lossValue) / maxAbs) * 100);
    const color = 'var(--status-' + r.status + ')';
    const name = feederNameFor(r.cells);
    return '<div class="meter-row">' +
      '<div class="meter-name" title="' + name + '">' + name + '</div>' +
      '<div class="meter-track"><div class="meter-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
      '<div class="meter-value">' + formatNumber(r.lossValue) + '%</div>' +
      '</div>';
  }).join('');
}

function populateDivisionFilter() {
  const sheet = activeSheet();
  const select = document.getElementById('divisionFilter');
  const divisionKey = sheet.headers.find(function (h) { return /division/i.test(h); });
  select.innerHTML = '<option value="">All divisions</option>';
  if (!divisionKey) { select.disabled = true; return; }
  select.disabled = false;
  const divisions = Array.from(new Set(sheet.rows.map(function (r) { return r.cells[divisionKey]; }).filter(Boolean))).sort();
  divisions.forEach(function (d) {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    select.appendChild(opt);
  });
}

function filteredSortedRows(sheet) {
  const divisionKey = sheet.headers.find(function (h) { return /division/i.test(h); });
  let rows = sheet.rows;

  if (state.status) rows = rows.filter(function (r) { return r.status === state.status; });
  if (state.division && divisionKey) rows = rows.filter(function (r) { return r.cells[divisionKey] === state.division; });
  if (state.search) {
    const q = state.search.toLowerCase();
    rows = rows.filter(function (r) {
      return Object.values(r.cells).some(function (v) { return String(v == null ? '' : v).toLowerCase().indexOf(q) !== -1; });
    });
  }

  if (state.sortKey) {
    rows = rows.slice().sort(function (a, b) {
      const av = a.cells[state.sortKey] == null ? '' : a.cells[state.sortKey];
      const bv = b.cells[state.sortKey] == null ? '' : b.cells[state.sortKey];
      const an = parseFloat(String(av).replace('%', ''));
      const bn = parseFloat(String(bv).replace('%', ''));
      let cmp;
      if (!isNaN(an) && !isNaN(bn)) cmp = an - bn;
      else cmp = String(av).localeCompare(String(bv));
      return cmp * state.sortDir;
    });
  }

  return rows;
}

function renderTable() {
  const sheet = activeSheet();
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  if (!sheet) { head.innerHTML = ''; body.innerHTML = ''; return; }

  const wideCols = new Set(['REMARKS', 'ACCOUNT ID AND REMARKS', 'Reason for High loss (If Any)']);

  head.innerHTML = '<tr><th data-key="__status">Status</th>' +
    sheet.headers.map(function (h) { return '<th data-key="' + h + '">' + h + '</th>'; }).join('') +
    '</tr>';

  head.querySelectorAll('th[data-key]').forEach(function (th) {
    th.addEventListener('click', function () {
      const key = th.dataset.key;
      if (key === '__status') return;
      if (state.sortKey === key) state.sortDir *= -1;
      else { state.sortKey = key; state.sortDir = 1; }
      render();
    });
  });

  const rows = filteredSortedRows(sheet);
  document.getElementById('rowCount').textContent = rows.length + ' of ' + sheet.rows.length + ' feeders';

  body.innerHTML = rows.map(function (r) {
    const meta = STATUS_META[r.status];
    const cells = sheet.headers.map(function (h) {
      const wrap = wideCols.has(h) ? ' wrap' : '';
      const v = r.cells[h];
      return '<td class="' + wrap + '">' + (v || (v === 0 ? '0' : '—')) + '</td>';
    }).join('');
    return '<tr><td><span class="status-badge status-' + r.status + '">' + meta.icon + ' ' + meta.label + '</span></td>' + cells + '</tr>';
  }).join('');
}

// --- meter register ---

function getGridData(entry) {
  return (entry.lastResult && entry.lastResult.gridData) || [];
}

function parseBillingDate(str) {
  const m = String(str || '').trim().match(/^(\d{2})-(\d{2})-(\d{4})/);
  if (!m) return null;
  return new Date(m[3] + '-' + m[2] + '-' + m[1]);
}

function latestReading(entry) {
  const grid = getGridData(entry);
  if (!grid.length) return null;
  return grid.slice().sort(function (a, b) {
    const da = parseBillingDate(a['billing Date']);
    const db = parseBillingDate(b['billing Date']);
    return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
  })[0];
}

function clean(v) {
  if (v === undefined || v === null) return '—';
  const s = String(v).trim();
  return s === '' ? '—' : s;
}

async function loadMeters() {
  state.meters = await runServer('getMeterRegistry');
}

function renderMeterTable() {
  const body = document.getElementById('meterTableBody');
  if (!state.meters.length) {
    body.innerHTML = '<tr><td colspan="8" class="stat-label">No meters tracked yet — click "+ Add meter".</td></tr>';
    return;
  }

  body.innerHTML = state.meters.map(function (m) {
    const reading = latestReading(m);
    const errorNote = m.lastError ? '<div class="stat-label" style="color:var(--status-critical)">' + m.lastError + '</div>' : '';
    return '<tr class="meter-table-row" data-meter="' + m.meterId + '">' +
      '<td>' + m.meterId + '</td>' +
      '<td>' + clean(m.label) + '</td>' +
      '<td>' + (m.lastFetchedAt ? new Date(m.lastFetchedAt).toLocaleString() : 'never') + errorNote + '</td>' +
      '<td>' + clean(reading && reading['billing Date']) + '</td>' +
      '<td>' + clean(reading && reading['energy KWH']) + '</td>' +
      '<td>' + clean(reading && reading['md kW']) + '</td>' +
      '<td>' + clean(reading && reading['billing Tamper Count']) + '</td>' +
      '<td class="row-actions">' +
        '<button data-action="fetch" data-meter="' + m.meterId + '">Fetch</button>' +
        '<button data-action="edit" data-meter="' + m.meterId + '">Edit</button>' +
        '<button data-action="delete" data-meter="' + m.meterId + '">Remove</button>' +
      '</td></tr>';
  }).join('');

  body.querySelectorAll('tr[data-meter]').forEach(function (tr) {
    tr.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;
      const id = tr.dataset.meter;
      state.expandedMeterId = state.expandedMeterId === id ? null : id;
      renderMeterDetail();
    });
  });

  body.querySelectorAll('button[data-action]').forEach(function (btn) {
    btn.addEventListener('click', async function (e) {
      e.stopPropagation();
      const id = btn.dataset.meter;
      const action = btn.dataset.action;
      if (action === 'fetch') await fetchMeter(id);
      else if (action === 'edit') await editMeterPrompt(id);
      else if (action === 'delete') await deleteMeterConfirm(id);
    });
  });
}

function renderMeterDetail() {
  const panel = document.getElementById('meterDetailPanel');
  if (!state.expandedMeterId) { panel.style.display = 'none'; panel.innerHTML = ''; return; }

  const entry = state.meters.find(function (m) { return m.meterId === state.expandedMeterId; });
  const reading = entry && latestReading(entry);

  panel.style.display = '';
  if (!reading) {
    panel.innerHTML = '<h2 class="panel-title">' + state.expandedMeterId + '</h2><p class="stat-label">No data fetched yet for this meter — click "Fetch".</p>';
    return;
  }

  const fields = Object.entries(reading).filter(function (kv) { return kv[0] !== 'meter ID'; });
  panel.innerHTML = '<h2 class="panel-title">' + state.expandedMeterId + ' — latest billing cycle (' + clean(reading['billing Date']) + ')</h2>' +
    '<div class="detail-grid">' +
    fields.map(function (kv) { return '<div class="detail-field"><div class="k">' + kv[0] + '</div><div class="v">' + clean(kv[1]) + '</div></div>'; }).join('') +
    '</div>';
}

async function fetchMeter(meterId) {
  const btn = document.querySelector('button[data-action="fetch"][data-meter="' + meterId + '"]');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const updated = await runServer('fetchMeterData', meterId, new Date().getFullYear());
    state.meters = state.meters.map(function (m) { return m.meterId === meterId ? updated : m; });
  } catch (err) {
    window.alert('Fetch failed: ' + err.message);
  } finally {
    renderMeterTable();
    renderMeterDetail();
  }
}

async function refreshAllMeters() {
  for (const m of state.meters) {
    await fetchMeter(m.meterId);
  }
}

async function addMeterPrompt() {
  const meterId = window.prompt('Meter ID to track (e.g. GE9447014):');
  if (!meterId || !meterId.trim()) return;
  const label = window.prompt('Optional label (feeder name, location, etc.):', '') || '';
  try {
    state.meters = await runServer('addMeter', meterId.trim(), label.trim());
    renderMeterTable();
  } catch (err) {
    window.alert(err.message);
  }
}

async function editMeterPrompt(meterId) {
  const entry = state.meters.find(function (m) { return m.meterId === meterId; });
  const newMeterId = window.prompt('Change meter ID to:', entry ? entry.meterId : meterId);
  if (newMeterId === null) return;
  const label = window.prompt('Label:', entry ? entry.label : '');
  try {
    state.meters = await runServer('editMeter', meterId, newMeterId.trim(), (label || '').trim());
    renderMeterTable();
  } catch (err) {
    window.alert(err.message);
  }
}

async function deleteMeterConfirm(meterId) {
  if (!window.confirm('Stop tracking meter ' + meterId + '?')) return;
  state.meters = await runServer('deleteMeter', meterId);
  if (state.expandedMeterId === meterId) state.expandedMeterId = null;
  renderMeterTable();
  renderMeterDetail();
}

// --- shell ---

function render() {
  renderTabs();

  const onMeterTab = state.activeSheetId === METER_TAB_ID;
  document.getElementById('reportView').style.display = onMeterTab ? 'none' : '';
  document.getElementById('meterRegisterView').style.display = onMeterTab ? '' : 'none';

  if (onMeterTab) {
    renderMeterTable();
    renderMeterDetail();
    return;
  }

  renderStats();
  renderMeterList();
  populateDivisionFilter();
  renderTable();
}

async function boot() {
  const status = await refreshSessionBadge();
  const loggedIn = status.loggedIn && !status.refreshExpired;

  document.getElementById('loginPanel').style.display = loggedIn ? 'none' : '';
  document.getElementById('tabs').style.display = loggedIn ? '' : 'none';
  document.getElementById('mainView').style.display = loggedIn ? '' : 'none';

  if (status.username) document.getElementById('loginUsername').value = status.username;

  if (!loggedIn) return;

  const [lineLoss] = await Promise.all([runServer('getLineLossPayload'), loadMeters()]);
  state.sheets = lineLoss.sheets;
  if (!state.activeSheetId) state.activeSheetId = lineLoss.sheets[0] && lineLoss.sheets[0].id;
  document.getElementById('generatedAt').textContent = 'Data generated: ' + new Date(lineLoss.generatedAt).toLocaleString();
  render();
}

function init() {
  applyStoredTheme();
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('addMeterBtn').addEventListener('click', addMeterPrompt);
  document.getElementById('refreshAllBtn').addEventListener('click', refreshAllMeters);
  document.getElementById('searchBox').addEventListener('input', function (e) { state.search = e.target.value; renderTable(); });
  document.getElementById('divisionFilter').addEventListener('change', function (e) { state.division = e.target.value; renderTable(); });
  document.getElementById('statusChips').addEventListener('click', function (e) {
    if (e.target.dataset.status === undefined) return;
    state.status = e.target.dataset.status;
    document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
    e.target.classList.add('active');
    renderTable();
  });
  document.querySelector('.chip[data-status=""]').classList.add('active');

  boot();
}

init();
</script>
