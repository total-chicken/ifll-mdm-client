<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line Loss Dashboard — DVVNL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-title">
      <h1>Line Loss Dashboard</h1>
      <p class="subtitle">DVVNL &middot; Genus URJA+ MDM</p>
    </div>
    <div class="topbar-actions">
      <span id="sourceBadge" class="badge badge-muted">loading…</span>
      <button id="themeToggle" class="btn-icon" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="sheetView">
    <section class="stat-row" id="statRow"></section>

    <section class="panel" id="topOffenders">
      <h2 class="panel-title">Highest line loss</h2>
      <div class="meter-list" id="meterList"></div>
    </section>

    <section class="panel">
      <div class="table-toolbar">
        <input id="searchBox" type="search" placeholder="Search feeder, code, meter no…" class="search-input">
        <select id="divisionFilter" class="filter-select">
          <option value="">All divisions</option>
        </select>
        <div class="status-chips" id="statusChips">
          <button class="chip" data-status="">All</button>
          <button class="chip" data-status="good">Good</button>
          <button class="chip" data-status="warning">Warning</button>
          <button class="chip" data-status="critical">Critical</button>
          <button class="chip" data-status="pending">Pending data</button>
          <button class="chip" data-status="error">Error</button>
        </div>
      </div>
      <div class="table-scroll">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <p class="row-count" id="rowCount"></p>
    </section>
  </main>

  <footer class="footer">
    <span id="generatedAt"></span>
  </footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
